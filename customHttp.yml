customHeaders:
    # Security headers
    -   pattern: '**/*'
        headers:
            -   key: 'Strict-Transport-Security'
                value: 'max-age=31536000; includeSubDomains'
            -   key: 'X-Frame-Options'
                value: 'SAMEORIGIN'
            -   key: 'X-XSS-Protection'
                value: '1; mode=block'
            -   key: 'X-Content-Type-Options'
                value: 'nosniff'
    # Cache-Control headers
    -   pattern: '**/**.html'
        headers:
            -   key: 'Cache-Control'
                value: 'public, max-age=0, must-revalidate'
    # Built JS, CSS and images; every filename carries a content hash.
    -   pattern: '_astro/**'
        headers:
            -   key: 'Cache-Control'
                value: 'public, max-age=31536000, immutable'
    # Unhashed files the build regenerates: the search index and manifest.
    -   pattern: '**/**.json'
        headers:
            -   key: 'Cache-Control'
                value: 'public, max-age=0, must-revalidate'
    -   pattern: 'manifest.webmanifest'
        headers:
            -   key: 'Cache-Control'
                value: 'public, max-age=0, must-revalidate'
    # The self-removing replacement for Gatsby's service worker; browsers
    # must always see the current one.
    -   pattern: 'sw.js'
        headers:
            -   key: 'Cache-Control'
                value: 'public, max-age=0, must-revalidate'

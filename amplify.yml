version: 1.0
frontend:
    phases:
        preBuild:
            commands:
                - export NVM_DIR="$HOME/.nvm"
                - . "$NVM_DIR/nvm.sh"
                - nvm install --no-progress
                - nvm use
                - export CI=true
                - export ASTRO_TELEMETRY_DISABLED=1
                - npm ci --no-audit --no-fund
        build:
            commands:
                - npm run build
    artifacts:
        baseDirectory: dist
        files:
            - '**/*'
    cache:
        paths:
            - $HOME/.npm/**/*

name: Playwright

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Astro keeps optimised images and downloaded fonts here. Restored
      # after npm ci, which wipes node_modules, so a build only encodes
      # images it hasn't seen. Cold, image encoding takes about 4 minutes.
      - name: Restore Astro asset cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.astro/assets
            node_modules/.astro/fonts
          key: astro-assets-${{ runner.os }}-${{ github.sha }}
          restore-keys: astro-assets-${{ runner.os }}-

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # The email subscriptions stack and its signup function. See
      # docs/email-subscriptions.md.
      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      - name: Infra tests
        run: npm test
        working-directory: infra

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e:ci

      - name: Upload Playwright report and failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
